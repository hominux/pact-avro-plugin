[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2021-0139", reason = "ansi_term is unmaintained; reached through pact_matching and no fixed release exists" },
    { id = "RUSTSEC-2020-0095", reason = "difference is unmaintained; reached through pact_matching and no fixed release exists" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is unmaintained; reached through hashers from pact_models and no fixed release exists" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained; reached through pact_mock_server from pact_consumer and no fixed release exists" },
    { id = "RUSTSEC-2023-0071", reason = "rsa has a non-constant-time timing sidechannel (Marvin Attack); reached through pact-plugin-driver and no fixed release exists" },
    { id = "RUSTSEC-2026-0367", reason = "zip extraction preserves SUID/SGID bits; reached through pact-plugin-driver, which pins zip ^8.6.0; fixed in zip 9, remove once pact-plugin-driver adopts it" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() creates symlinks whose targets escape the destination; reached through pact-plugin-driver, which pins zip ^8.6.0; fixed in zip 9, remove once pact-plugin-driver adopts it" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() applies Unix permissions through symlinks without confining the target; reached through pact-plugin-driver, which pins zip ^8.6.0; fixed in zip 9, remove once pact-plugin-driver adopts it" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MIT-0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
